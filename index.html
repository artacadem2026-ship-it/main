```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>وبلاگ شخصی من</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: #111;
            color: white;
            font-family: Tahoma, Arial, sans-serif;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            padding: 30px;
        }

        .profile-image {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 25px;
            border: 4px solid white;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            line-height: 2;
            color: #ccc;
        }

        .music-button {
            margin-top: 25px;
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            background: white;
            color: #111;
            font-size: 18px;
            cursor: pointer;
        }

        .music-button:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="container">

        <img 
            src="profile.jpg" 
            alt="عکس من" 
            class="profile-image"
        >

        <h1>سلام، من ... هستم</h1>

        <p>
            به وبلاگ شخصی من خوش آمدید.
            اینجا می‌توانید نوشته‌ها، موسیقی و مطالب مورد علاقه من را ببینید.
        </p>

        <button class="music-button" onclick="playMusic()">
            🎵 پخش موسیقی
        </button>

        <audio id="music">
            <source src="music.mp3" type="audio/mpeg">
        </audio>

    </div>

    <script>
        function playMusic() {
            const music = document.getElementById("music");

            if (music.paused) {
                music.play();
            } else {
                music.pause();
            }
        }
    </script>

</body>
</html>
```
